<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ساعة بغداد - الفخامة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="canvas-container"></div>

    <!-- لوحة التحكم الأفقية السفلية -->
    <div class="ui-panel">
        <div class="control-group">
            <label>الأرقام</label>
            <select id="num-style">
                <option value="english">إنجليزي</option>
                <option value="arabic">عربي</option>
                <option value="roman">روماني</option>
            </select>
        </div>
        <div class="control-group">
            <label>لون الأرقام</label>
            <input type="color" id="num-color" value="#d4af37">
        </div>
        <div class="control-group">
            <label>لون الواجهة</label>
            <input type="color" id="dial-color" value="#0a0a0a">
        </div>
        
        <div class="divider"></div>

        <div class="control-group">
            <label>نوع الحزام</label>
            <select id="strap-type">
                <option value="leather">جلد طبيعي</option>
                <option value="steel">معدن (ستيل)</option>
            </select>
        </div>
        
        <!-- خيارات الجلد -->
        <div class="control-group leather-options">
            <label>لون الجلد</label>
            <input type="color" id="strap-color" value="#2b1a10">
        </div>
        <div class="control-group leather-options">
            <label>ملمس الجلد</label>
            <select id="leather-texture">
                <option value="smooth">ناعم</option>
                <option value="grain">ضربات (مموج)</option>
            </select>
        </div>
        
        <!-- خيارات الستيل -->
        <div class="control-group steel-options" style="display: none;">
            <label>لون الستيل</label>
            <input type="color" id="steel-color" value="#e0e0e0">
        </div>
        <div class="control-group steel-options" style="display: none;">
            <label>شكل الحلقات</label>
            <select id="steel-shape">
                <option value="square">مربعة</option>
                <option value="round">دائرية</option>
            </select>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
