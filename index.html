<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ساعة بغداد - 3D</title>
    <!-- ربط ملف التنسيق -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- منطقة عرض الساعة -->
    <div id="canvas-container"></div>

    <!-- لوحة التحكم الأفقية السفلية -->
    <div class="ui-panel">
        <div class="control-group">
            <label>الأرقام</label>
            <select id="num-style">
                <option value="english">إنجليزي</option>
                <option value="arabic">عربي</option>
                <option value="roman">روماني</option>
            </select>
        </div>
        <div class="control-group">
            <label>لون الأرقام</label>
            <input type="color" id="num-color" value="#d4af37">
        </div>
        <div class="control-group">
            <label>لون الواجهة</label>
            <input type="color" id="dial-color" value="#111111">
        </div>
        
        <div class="divider"></div>

        <div class="control-group">
            <label>نوع الحزام</label>
            <select id="strap-type">
                <option value="leather">جلد</option>
                <option value="steel">ستيل</option>
            </select>
        </div>
        
        <!-- خيارات الجلد -->
        <div class="control-group" id="leather-options">
            <label>لون الجلد</label>
            <input type="color" id="strap-color" value="#3e2723">
        </div>
        
        <!-- خيارات الستيل -->
        <div class="control-group" id="steel-options" style="display: none;">
            <label>لون الستيل</label>
            <input type="color" id="steel-color" value="#c0c0c0">
        </div>
    </div>

    <!-- مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- ربط ملف البرمجة -->
    <script src="script.js"></script>
</body>
</html>ss
